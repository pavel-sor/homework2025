<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата успешна | Галина Инглиш</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .success-page {
      max-width: 500px;
      margin: 120px auto 60px;
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: var(--radius-xl);
      border: 1px solid var(--line);
      box-shadow: 0 24px 52px rgba(14, 25, 64, 0.09);
    }
    .success-icon { font-size: 72px; margin-bottom: 20px; }
    .success-page h1 { 
      font-family: "Cormorant Garamond", serif;
      color: #2d7a3e;
      font-size: 36px;
    }
    .success-page p {
      color: var(--muted);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="page-noise"></div>
  <div class="success-page">
    <div class="success-icon">✅</div>
    <h1>Оплата прошла успешно!</h1>
    <p>Спасибо за доверие. Я свяжусь с вами в ближайшее время для подтверждения записи.</p>
    <a href="index.html" class="btn-primary" style="display: inline-block; margin-top: 24px;">Вернуться на сайт</a>
  </div>
</body>
</html>
