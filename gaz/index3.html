<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слайдер - Одинаковые переходы</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&family=Roboto:wght@500&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .slider-wrapper {
            width: 100vw;
            height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            overflow: visible !important;
            perspective: 1200px;
            padding: 30px 0;
        }

        /* Слайды */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            z-index: 1;
            transform-style: preserve-3d;
            overflow: visible !important;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        /* Контейнер для фона */
        .slide-bg-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .slide-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform-style: preserve-3d;
            transition: all 0s ease;
        }

        /* ========== ОДИНАКОВЫЙ ЭФФЕКТ ДЛЯ ВСЕХ СЛАЙДОВ ========== */
        .slide.active .slide-bg {
            animation: slideEffect 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes slideEffect {
            0% {
                transform: scale(1.5) rotate(15deg) translateX(-50px);
                filter: brightness(0.2) blur(3px);
                opacity: 0;
            }

            40% {
                transform: scale(1.2) rotate(5deg) translateX(-20px);
                filter: brightness(0.5) blur(1px);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0deg) translateX(0px);
                filter: brightness(1);
                opacity: 1;
            }
        }

        /* ========== Оверлей ========== */
        .slide-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease 0.3s;
        }

        .slide.active .slide-overlay {
            opacity: 1;
        }

        .slide-overlay.light-dark {
            background: rgba(0, 0, 0, 0.25);
        }

        /* ========== Контент слайда ========== */
        .slide-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            width: 90%;
            max-width: 800px;
            text-align: left;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            overflow: visible !important;
            padding: 20px;
        }

        .slide-content * {
            pointer-events: auto;
        }

        .slide-title {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(32px, 8vw, 109px);
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            line-height: 1.1;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            text-align: left;
            width: 100%;
            opacity: 0;
            transform: scale(0.8) rotateY(20deg);
        }

        .slide.active .slide-title {
            animation: textAppear 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 1.8s;
        }

        .slide-desc {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(14px, 1.5vw, 22px);
            margin-bottom: 30px;
            font-weight: 500;
            color: #fff;
            letter-spacing: 3.62px;
            line-height: 1.6;
            max-width: 600px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            text-align: left;
            opacity: 0;
            transform: scale(0.8) rotateY(20deg);
        }

        .slide.active .slide-desc {
            animation: textAppear 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 2.3s;
        }

        /* ===== ИСПРАВЛЕННЫЕ СТИЛИ КНОПКИ ===== */
        .slide-btn {
            display: inline-block;
            font-family: 'Roboto', sans-serif;
            font-size: clamp(14px, 1.2vw, 19px);
            font-weight: 500;
            color: #000000;
            text-decoration: none;
            padding: 0 clamp(25px, 4vw, 56px);
            line-height: clamp(40px, 4vw, 56px);
            border-radius: 5px;
            background: linear-gradient(135deg, #FF9500 0%, #FF5E3A 100%);
            box-shadow: 0 9px 19px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
            margin: 15px 0;
            align-self: flex-start;
            opacity: 0;
            transform: scale(0.8) rotateY(20deg);
            position: relative;
            overflow: visible !important;
            cursor: pointer;
            border: none;
            transform-origin: center center;
            will-change: transform;
            z-index: 5;
        }

        .slide.active .slide-btn {
            animation: textAppear 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 2.8s;
        }

        /* Увеличение при наведении */
        .slide-btn:hover {
            transform: scale(1.1) rotateY(20deg) !important;
            box-shadow: 0 12px 25px rgba(255, 149, 0, 0.4);
            background: linear-gradient(135deg, #FF8C00 0%, #FF4500 100%);
            overflow: visible !important;
            z-index: 10;
        }

        /* Нажатие */
        .slide-btn:active {
            transform: scale(0.95) rotateY(20deg) !important;
            box-shadow: 0 5px 10px rgba(255, 149, 0, 0.3);
        }

        /* Пульсация ВНУТРИ кнопки */
        .slide-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
            pointer-events: none;
            z-index: -1;
        }

        .slide-btn:hover::before {
            width: 100%;
            height: 100%;
            max-width: 300px;
            max-height: 300px;
        }

        /* Текст поверх пульсации */
        .slide-btn span {
            position: relative;
            z-index: 1;
        }

        @keyframes textAppear {
            0% {
                opacity: 0;
                transform: scale(0.5) rotateY(30deg) translateZ(-50px);
                filter: brightness(0.3);
            }

            60% {
                opacity: 1;
                transform: scale(1.1) rotateY(-5deg) translateZ(10px);
                filter: brightness(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotateY(0deg) translateZ(0px);
                filter: brightness(1);
            }
        }

        /* ========== Навигация ========== */
        .slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: transparent;
            border: none;
            color: #fff;
            font-size: clamp(30px, 3vw, 60px);
            width: auto;
            height: auto;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 15px;
            line-height: 1;
            text-align: center;
            font-family: Arial, sans-serif;
            opacity: 0;
            transition: opacity 0.5s ease 3.5s;
        }

        .slider-container.loaded .slider-nav {
            opacity: 1;
        }

        .slider-prev {
            left: 20px;
        }

        .slider-next {
            right: 20px;
        }

        .slider-nav:hover {
            color: #5AC8FA;
            background: transparent;
        }

        /* ========== Индикаторы (линии) ========== */
        .slider-dots {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            opacity: 0;
            transition: opacity 0.5s ease 3.5s;
            gap: 10px;
        }

        .slider-container.loaded .slider-dots {
            opacity: 1;
        }

        .slider-dot {
            width: clamp(40px, 8vw, 100px);
            height: 1px;
            border-radius: 0;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0;
        }

        .slider-dot.active {
            background: #5AC8FA;
            transform: none;
        }

        .slider-dot:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        /* ========== Адаптив ========== */
        @media (max-width: 768px) {
            .slide-content {
                width: 85%;
                padding: 15px;
            }

            .slider-nav {
                font-size: 30px;
                padding: 5px 10px;
            }

            .slider-prev {
                left: 10px;
            }

            .slider-next {
                right: 10px;
            }

            .slider-dots {
                bottom: 20px;
                gap: 8px;
            }

            .slider-dot {
                width: 50px;
            }
        }

        @media (max-width: 480px) {
            .slide-content {
                width: 90%;
                padding: 10px;
            }

            .slider-nav {
                display: none;
            }

            .slider-dots {
                bottom: 15px;
                gap: 6px;
            }

            .slider-dot {
                width: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="slider-wrapper">
        <div class="slider-container" id="slider">

            <!-- Слайд 1 -->
            <div class="slide active" data-slide="0">
                <div class="slide-bg-wrapper">
                    <img class="slide-bg"
                        src="https://webdeveloper193.ru/wp-content/uploads/2026/07/abstract-wavy-background-1536x1024.png"
                        alt="Фон слайда" loading="lazy">
                </div>
                <div class="slide-overlay light-dark"></div>
                <div class="slide-content">
                    <h1 class="slide-title">ЛК-Мотор</h1>
                    <p class="slide-desc">Информация Информация Информация Информация Информация</p>
                    <a href="tel:89228288088" class="slide-btn">Консультация</a>
                </div>
            </div>

            <!-- Слайд 2 -->
            <div class="slide" data-slide="1">
                <div class="slide-bg-wrapper">
                    <img class="slide-bg"
                        src="https://webdeveloper193.ru/wp-content/uploads/2026/07/magnific_surreal-abstraction-of-pr_fFmIKoHCDY.png"
                        alt="Фон слайда" loading="lazy">
                </div>
                <div class="slide-overlay light-dark"></div>
                <div class="slide-content">
                    <h1 class="slide-title">12 лет</h1>
                    <p class="slide-desc">Информация Информация Информация Информация Информация</p>
                    <a href="tel:89228288088" class="slide-btn">Консультация</a>
                </div>
            </div>

            <!-- Кнопки навигации -->
            <button class="slider-nav slider-prev" id="prevBtn" aria-label="Предыдущий слайд">‹</button>
            <button class="slider-nav slider-next" id="nextBtn" aria-label="Следующий слайд">›</button>

            <!-- Индикаторы -->
            <div class="slider-dots" id="dotsContainer">
                <button class="slider-dot active" data-index="0" aria-label="Слайд 1"></button>
                <button class="slider-dot" data-index="1" aria-label="Слайд 2"></button>
            </div>

        </div>
    </div>

    <script>
        (function () {
            const slider = document.getElementById('slider');
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.slider-dot');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            let current = 0;
            const total = slides.length;
            let autoPlayTimer = null;
            let isTransitioning = false;

            function checkImagesLoaded() {
                const images = document.querySelectorAll('.slide-bg');
                let loadedCount = 0;
                const totalImages = images.length;

                if (totalImages === 0) {
                    slider.classList.add('loaded');
                    return;
                }

                images.forEach(img => {
                    if (img.complete) {
                        loadedCount++;
                    } else {
                        img.addEventListener('load', function () {
                            loadedCount++;
                            if (loadedCount === totalImages) {
                                slider.classList.add('loaded');
                            }
                        });
                        img.addEventListener('error', function () {
                            loadedCount++;
                            if (loadedCount === totalImages) {
                                slider.classList.add('loaded');
                            }
                        });
                    }
                });

                if (loadedCount === totalImages) {
                    slider.classList.add('loaded');
                }
            }

            checkImagesLoaded();

            function goTo(index) {
                if (isTransitioning) return;
                if (index < 0) index = total - 1;
                if (index >= total) index = 0;
                if (index === current) return;

                isTransitioning = true;

                const currentSlide = slides[current];
                const nextSlide = slides[index];

                currentSlide.classList.remove('active');
                dots[current].classList.remove('active');
                nextSlide.classList.add('active');
                dots[index].classList.add('active');

                const bg = nextSlide.querySelector('.slide-bg');
                if (bg) {
                    bg.style.animation = 'none';
                    void bg.offsetWidth;
                    bg.style.animation = '';
                }

                const title = nextSlide.querySelector('.slide-title');
                const desc = nextSlide.querySelector('.slide-desc');
                const btn = nextSlide.querySelector('.slide-btn');

                if (title) {
                    title.style.animation = 'none';
                    void title.offsetWidth;
                    title.style.animation = '';
                }
                if (desc) {
                    desc.style.animation = 'none';
                    void desc.offsetWidth;
                    desc.style.animation = '';
                }
                if (btn) {
                    btn.style.animation = 'none';
                    void btn.offsetWidth;
                    btn.style.animation = '';
                }

                current = index;

                setTimeout(() => {
                    isTransitioning = false;
                }, 3500);
            }

            function nextSlide() {
                goTo(current + 1);
                resetAutoPlay();
            }

            function prevSlide() {
                goTo(current - 1);
                resetAutoPlay();
            }

            prevBtn.addEventListener('click', function (e) {
                e.preventDefault();
                prevSlide();
            });

            nextBtn.addEventListener('click', function (e) {
                e.preventDefault();
                nextSlide();
            });

            dots.forEach((dot, index) => {
                dot.addEventListener('click', function (e) {
                    e.preventDefault();
                    goTo(index);
                    resetAutoPlay();
                });
            });

            function startAutoPlay() {
                if (autoPlayTimer) clearInterval(autoPlayTimer);
                autoPlayTimer = setInterval(nextSlide, 10000);
            }

            function resetAutoPlay() {
                if (autoPlayTimer) {
                    clearInterval(autoPlayTimer);
                    autoPlayTimer = null;
                }
                startAutoPlay();
            }

            if (slider.classList.contains('loaded')) {
                startAutoPlay();
            } else {
                const observer = new MutationObserver(function () {
                    if (slider.classList.contains('loaded')) {
                        startAutoPlay();
                        observer.disconnect();
                    }
                });
                observer.observe(slider, { attributes: true, attributeFilter: ['class'] });
            }

            const container = document.getElementById('slider');
            container.addEventListener('mouseenter', function () {
                if (autoPlayTimer) {
                    clearInterval(autoPlayTimer);
                    autoPlayTimer = null;
                }
            });

            container.addEventListener('mouseleave', function () {
                if (slider.classList.contains('loaded')) {
                    startAutoPlay();
                }
            });

            let touchStartX = 0;
            let touchEndX = 0;

            container.addEventListener('touchstart', function (e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            container.addEventListener('touchend', function (e) {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) {
                        nextSlide();
                    } else {
                        prevSlide();
                    }
                    resetAutoPlay();
                }
            }, { passive: true });

        })();
    </script>

</body>

</html>
